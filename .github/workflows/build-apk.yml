name: Build Khanqah Darul Falah Native Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (for Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure built-in Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Ensure ImageMagick for launcher icon sizing
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi

      - name: Cache Android signing keystore (enables Play-Store-like in-place app updates)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ github.repository_id }}-v1

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle for Android APK
        env:
          VITE_CAPACITOR_BUILD: "true"
        run: npm run build

      - name: Install Capacitor CLI & Android runtime
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Generate and configure Native Android project
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            export KDF_LIVE_WEB_URL="https://${OWNER}.github.io/"
          else
            export KDF_LIVE_WEB_URL="https://${OWNER}.github.io/${REPO}/"
          fi
          export KDF_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          export KDF_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          export KDF_APK_VERSION_JSON_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/apk-version.json"
          export KDF_APK_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/Khanqah-Darul-Falah.apk"
          echo "Configured OTA Live Web URL: $KDF_LIVE_WEB_URL"
          echo "Configured APK Version: $KDF_VERSION_NAME ($KDF_VERSION_CODE)"
          rm -rf android
          npx cap add android
          node scripts/setup-android-apk.mjs
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Khanqah-Darul-Falah.apk

      - name: Generate APK version metadata
        run: |
          V_CODE=$((GITHUB_RUN_NUMBER + 100))
          V_NAME="1.0.${GITHUB_RUN_NUMBER}"
          cat <<EOF > apk-version.json
          {
            "versionCode": ${V_CODE},
            "versionName": "${V_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/Khanqah-Darul-Falah.apk"
          }
          EOF

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khanqah-Darul-Falah-APK
          path: Khanqah-Darul-Falah.apk
          retention-days: 30

      - name: Publish Direct Download APK Release (Mobile 1-Tap & In-App Self-Updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          TITLE="Khanqah Darul Falah Official Android APK"
          NOTES="خانقاہ دارالفلاح آفیشل اینڈرائڈ ایپ — ورژن 1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Khanqah-Darul-Falah.apk apk-version.json --clobber
          else
            gh release create "$TAG" Khanqah-Darul-Falah.apk apk-version.json --target "${{ github.ref_name }}" --title "$TITLE" --notes "$NOTES"
          fi
