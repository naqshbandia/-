<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خانقاہ دارالفلاح — اوقاتِ جماعت</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Tajawal', 'Noto Sans Arabic', system-ui, sans-serif;
      background: #071b10;
      color: #ecfdf5;
      line-height: 1.7;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #0b2416;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 6px 0;
      text-align: center;
      font-size: 20px;
      color: #d4af37;
    }
    .sub {
      margin: 0 0 14px 0;
      text-align: center;
      font-size: 12.5px;
      color: #a7f3d0;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    th {
      text-align: right;
      font-size: 12px;
      color: #d4af37;
      padding: 4px 12px;
    }
    th:last-child {
      text-align: left;
    }
    td {
      background: #064326;
      border-top: 1px solid rgba(212, 175, 55, 0.45);
      border-bottom: 1px solid rgba(212, 175, 55, 0.45);
      padding: 11px 14px;
      font-weight: bold;
      font-size: 15px;
    }
    td:first-child {
      border-right: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 0 12px 12px 0;
      color: #d4af37;
    }
    td:last-child {
      border-left: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 12px 0 0 12px;
      color: #00ff99;
      text-align: left;
      direction: ltr;
    }
    .note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px dashed rgba(212, 175, 55, 0.45);
      font-size: 11.5px;
      text-align: center;
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🕌 خانقاہ دارالفلاح — اوقاتِ جماعت</h1>
    <p class="sub">نزد ملک آڈہ میراخیل، بنوں</p>

    <!--
      ================================================================
      ہدایت برائے ایڈمن:
      خانقاہ کے جماعت کے اوقات تبدیل کرنے کے لیے صرف نیچے دیے گئے
      اوقات (مثلاً 06:00 AM یا اذان کے 5 منٹ بعد) کو بدل کر محفوظ کر دیں۔
      ایپ خودکار طور پر یہاں سے نیا وقت اٹھا لے گی۔
      ================================================================
    -->
    <table id="khanqah-jamaat-table">
      <thead>
        <tr>
          <th>نماز</th>
          <th>وقتِ جماعت</th>
        </tr>
      </thead>
      <tbody>
        <!-- 1. نمازِ فجر -->
        <tr>
          <td>فجر</td>
          <td>06:00 AM</td>
        </tr>
        <!-- 2. نمازِ ظہر -->
        <tr>
          <td>ظہر</td>
          <td>01:30 PM</td>
        </tr>
        <!-- 3. نمازِ عصر -->
        <tr>
          <td>عصر</td>
          <td>04:00 PM</td>
        </tr>
        <!-- 4. نمازِ مغرب (مقررہ وقت مثلاً 05:15 PM یا اذان کے 5 منٹ بعد دونوں لکھ سکتے ہیں) -->
        <tr>
          <td>مغرب</td>
          <td>اذان کے 5 منٹ بعد</td>
        </tr>
        <!-- 5. نمازِ عشاء -->
        <tr>
          <td>عشاء</td>
          <td>07:00 PM</td>
        </tr>
        <!-- 6. نمازِ جمعہ -->
        <tr>
          <td>جمعہ</td>
          <td>01:30 PM</td>
        </tr>
      </tbody>
    </table>

    <div class="note">
      اس فائل میں تبدیلی کرنے سے خانقاہ دارالفلاح ایپ میں اوقاتِ جماعت خودکار طور پر اپڈیٹ ہو جاتے ہیں۔
    </div>
  </div>
</body>
</html>
